{% extends 'layout.html' %}

{% block content %}
<h2>Cerrar Caja - {{ saldo_diario.fecha }}</h2>

<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <label for="saldo_fisico">Saldo Físico</label>
        <input type="number" step="0.01" class="form-control" id="saldo_fisico" name="saldo_fisico" required>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Cerrar Caja</button>
</form>
{% endblock %}
